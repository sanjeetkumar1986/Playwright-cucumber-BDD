name: Playwright Cucumber E2E Tests

on:
  schedule:
    - cron: '20 20 * * 5'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run BDD Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers with Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Cucumber Tests
        id: cucumber_tests
        env:
          HEADED: 'false'
          QA_FLIPKART_URL: https://www.flipkart.com/
        run: npx cucumber-js --config src/config/cucumber.js --backtrace

      - name: Upload Allure Raw Results (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Generate Allure Report
        if: always()
        run: |
          npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: allure-results/*-failure.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Archive Allure Report for Email
        if: always()
        run: |
          zip -r allure-report.zip allure-report/

      - name: Send Execution Report Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Test Execution Status: ${{ job.status }} - ${{ github.repository }} (Run #${{ github.run_number }})"
          to: ${{ secrets.MAIL_RECIPIENTS }}
          from: "Automation Reporter <${{ secrets.MAIL_USERNAME }}>"
          html_body: |
            <h2>Test Execution Summary</h2>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
            <p><strong>Triggered By:</strong> ${{ github.actor }}</p>
            <p><strong>Job Status:</strong> <span style="color: ${{ job.status == 'success' && 'green' || 'red' }}; font-weight: bold;">${{ job.status }}</span></p>
            <p><strong>GitHub Run Details:</strong> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Action Run</a></p>
            <p>The zipped Allure report is attached to this email.</p>
          attachments: allure-report.zip